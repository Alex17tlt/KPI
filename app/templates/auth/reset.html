{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Новый пароль</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/reset/{{ raw }}" class="stack">
    <label>Новый пароль<input type="password" name="password" required minlength="10" autofocus></label>
    <label>Повторите пароль<input type="password" name="password2" required minlength="10"></label>
    <button class="primary">Сохранить</button>
  </form>
</div>
{% endblock %}
