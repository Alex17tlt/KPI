{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Смена пароля</h1>
  {% if forced %}<div class="flash warn">Вам выдан временный пароль. Задайте собственный, чтобы продолжить.</div>{% endif %}
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/account/password" class="stack">
    <label>Текущий (или временный) пароль<input type="password" name="current" required autofocus></label>
    <label>Новый пароль<input type="password" name="password" required minlength="10"></label>
    <label>Повторите новый пароль<input type="password" name="password2" required minlength="10"></label>
    <button class="primary">Сохранить</button>
  </form>
</div>
{% endblock %}
